<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Control Center — Admin</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components/contact.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-header">
    <div>
      <span class="mono" style="color:var(--muted-dark); font-size:12px;">SYSTEM MANAGEMENT</span>
      <h1 class="display">Portfolio Dashboard</h1>
    </div>
    <div class="admin-nav">
      <a href="/" class="btn-secondary">← View Portfolio</a>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="messages">Inquiries &amp; Messages (<span id="msg-count">0</span>)</button>
    <button class="admin-tab" data-tab="projects">Manage Projects (<span id="proj-count">0</span>)</button>
    <button class="admin-tab" data-tab="new-project">+ Add Project</button>
  </div>

  <!-- Messages Panel -->
  <div id="panel-messages" class="admin-panel active">
    <div id="messages-list">
      <p class="mono" style="color:var(--muted-dark);">Loading inquiries...</p>
    </div>
  </div>

  <!-- Projects Panel -->
  <div id="panel-projects" class="admin-panel">
    <div id="projects-list">
      <p class="mono" style="color:var(--muted-dark);">Loading projects...</p>
    </div>
  </div>

  <!-- New Project Form Panel -->
  <div id="panel-new-project" class="admin-panel">
    <div class="contact-card" style="max-width:700px;">
      <h3>Publish New Project</h3>
      <p class="form-desc">Add a project directly to the portfolio database.</p>
      <form id="add-project-form">
        <div class="form-grid-2">
          <div class="form-group">
            <label for="p-title">Project Title</label>
            <input type="text" id="p-title" name="title" placeholder="e.g. Hyperion Gateway" required>
          </div>
          <div class="form-group">
            <label for="p-year">Year</label>
            <input type="text" id="p-year" name="year" placeholder="2025" required>
          </div>
        </div>

        <div class="form-group">
          <label for="p-category">Category / Tagline</label>
          <input type="text" id="p-category" name="category" placeholder="e.g. Distributed consensus" required>
        </div>

        <div class="form-group">
          <label for="p-description">Description</label>
          <textarea id="p-description" name="description" placeholder="Summary of what problem was solved and architectural highlights..." required></textarea>
        </div>

        <div class="form-group">
          <label for="p-stack">Tech Stack (comma separated)</label>
          <input type="text" id="p-stack" name="stack" placeholder="Go, Raft, gRPC, Docker" required>
        </div>

        <button type="submit" class="btn-submit">Add Project to Portfolio</button>
        <div id="project-form-status" class="form-status"></div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
