<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#14120F"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="rgba(240, 235, 224, 0.15)" stroke-width="1.5"/>
  
  <!-- Wireframe geometry (echoing 3D hero canvas) -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="#6C5CE7" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(108, 92, 231, 0.45)" stroke-width="1.2"/>
  <line x1="10" y1="20" x2="54" y2="44" stroke="rgba(108, 92, 231, 0.45)" stroke-width="1.2"/>
  <line x1="54" y1="20" x2="10" y2="44" stroke="rgba(108, 92, 231, 0.45)" stroke-width="1.2"/>
  
  <!-- Inner node dots -->
  <circle cx="32" cy="8" r="2" fill="#6C5CE7"/>
  <circle cx="54" cy="20" r="2" fill="#6C5CE7"/>
  <circle cx="54" cy="44" r="2" fill="#6C5CE7"/>
  <circle cx="32" cy="56" r="2" fill="#6C5CE7"/>
  <circle cx="10" cy="44" r="2" fill="#6C5CE7"/>
  <circle cx="10" cy="20" r="2" fill="#6C5CE7"/>
  
  <!-- Central D initial in signature cream -->
  <text x="32" y="39.5" font-family="'IBM Plex Mono', monospace, -apple-system, sans-serif" font-weight="700" font-size="21" fill="#F0EBE0" text-anchor="middle">D</text>
</svg>
